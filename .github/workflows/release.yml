name: Release

# Tauri builds are platform-native — a Linux runner can only produce a Linux
# installer, a Windows runner only a Windows one, etc. Jenkins here is a single
# Linux Docker agent, so it can never build the macOS/Windows installers no
# matter how it's configured. GitHub Actions' hosted runners give us all three
# platforms for free, which is why the actual multi-platform build lives here
# instead of in Jenkins. Jenkins keeps owning PR-gate CI into dev.
on:
  push:
    branches:
      - prod

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Hello World Desktop v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
